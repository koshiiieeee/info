<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Klent Josh Vargas">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    <meta name="description" content="Klent Josh Vargas · digital personal card">
    <title>Klent Josh Vargas · personal card</title>
    <style>
        /* ============================================================
           RESET & BASE
           ============================================================ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
            text-size-adjust: 100%;
            scroll-behavior: smooth;
            height: 100%;
        }

        body {
            min-height: 100vh;
            min-height: -webkit-fill-available;
            min-height: 100dvh;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(0.5rem, 2vw, 2rem);
            padding-top: max(clamp(0.5rem, 2vw, 2rem), env(safe-area-inset-top));
            padding-bottom: max(clamp(0.5rem, 2vw, 2rem), env(safe-area-inset-bottom));
            padding-left: max(clamp(0.5rem, 2vw, 2rem), env(safe-area-inset-left));
            padding-right: max(clamp(0.5rem, 2vw, 2rem), env(safe-area-inset-right));
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, 'Helvetica Neue', sans-serif;
            overflow-x: hidden;
            position: relative;
            cursor: none;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            -webkit-overflow-scrolling: touch;
        }

        a, button, .btn, .social-link, .info-item, .avatar, .card {
            cursor: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* ============================================================
           PARTICLE CANVAS
           ============================================================ */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background: #000000;
        }

        /* ============================================================
           CUSTOM GLOWING CURSOR (DESKTOP ONLY)
           ============================================================ */
        .cursor-glow {
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(80, 160, 255, 0.12) 0%, rgba(60, 130, 255, 0.06) 30%, transparent 70%);
            pointer-events: none;
            z-index: 1;
            transform: translate(-50%, -50%);
            transition: opacity 0.3s ease;
            mix-blend-mode: screen;
        }

        .cursor-dot {
            position: fixed;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 20px 6px rgba(100, 170, 255, 0.9), 0 0 40px 12px rgba(60, 130, 255, 0.5);
            pointer-events: none;
            z-index: 2;
            transform: translate(-50%, -50%);
            transition: width 0.2s ease, height 0.2s ease;
        }

        .cursor-ring {
            position: fixed;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1.5px solid rgba(120, 180, 255, 0.6);
            pointer-events: none;
            z-index: 2;
            transform: translate(-50%, -50%);
            transition: width 0.2s ease, height 0.2s ease, border-color 0.2s ease;
            box-shadow: 0 0 15px rgba(80, 150, 255, 0.4), inset 0 0 15px rgba(80, 150, 255, 0.2);
        }

        body:hover .cursor-dot {
            width: 10px;
            height: 10px;
        }

        /* Hide custom cursor on touch-only devices */
        @media (hover: none), (pointer: coarse) {
            body { cursor: auto; }
            a, button, .btn, .social-link, .info-item, .avatar, .card { cursor: auto; }
            .cursor-glow, .cursor-dot, .cursor-ring { display: none; }
        }

        /* ============================================================
           MAIN CARD — Fluid & Adaptive
           ============================================================ */
        .card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: min(440px, 95vw);
            background: rgba(10, 12, 18, 0.75);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: clamp(1.5rem, 4vw, 2.5rem);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.9),
                        0 0 0 1px rgba(255, 255, 255, 0.02) inset,
                        0 0 50px rgba(60, 130, 255, 0.08);
            padding: clamp(1.2rem, 4vw, 2.2rem) clamp(1rem, 3.5vw, 1.8rem);
            color: #f0f3fa;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: cardPulse 6s infinite alternate;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            transform: translateZ(0);
            will-change: transform;
        }

        @keyframes cardPulse {
            0% {
                box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.9),
                            0 0 0 1px rgba(255, 255, 255, 0.02) inset,
                            0 0 40px rgba(60, 130, 255, 0.05);
            }
            100% {
                box-shadow: 0 30px 70px -10px rgba(40, 100, 220, 0.25),
                            0 0 0 1.5px rgba(100, 170, 255, 0.15) inset,
                            0 0 80px rgba(60, 130, 255, 0.15);
            }
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 10%;
            width: 80%;
            height: 1px;
            background: linear-gradient(90deg, transparent, #4a7dff, #80b0ff, #4a7dff, transparent);
            opacity: 0.6;
            border-radius: 100%;
        }

        /* ============================================================
           PROFILE IMAGE
           ============================================================ */
        .avatar-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: clamp(0.5rem, 2vw, 0.8rem);
        }

        .avatar {
            width: clamp(70px, 25vw, 110px);
            height: clamp(70px, 25vw, 110px);
            border-radius: 50%;
            background: linear-gradient(145deg, #1a2a4a, #0f1a2e);
            border: 3px solid rgba(100, 160, 255, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(2rem, 8vw, 3.2rem);
            font-weight: 500;
            color: #b0c8ff;
            box-shadow: 0 0 30px rgba(60, 120, 255, 0.25),
                        0 8px 20px -6px rgba(0, 0, 0, 0.8);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            overflow: hidden;
            position: relative;
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
            -webkit-user-select: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        .avatar:hover {
            transform: scale(1.03) rotate(-2deg);
            box-shadow: 0 0 50px rgba(80, 150, 255, 0.45),
                        0 12px 24px -8px rgba(0, 0, 0, 0.9);
        }

        .avatar:active {
            transform: scale(0.98);
        }

        /* ============================================================
           NAME & TITLE
           ============================================================ */
        h1 {
            font-size: clamp(1.4rem, 5.5vw, 2rem);
            font-weight: 600;
            text-align: center;
            letter-spacing: -0.02em;
            line-height: 1.15;
            background: linear-gradient(to right, #ffffff, #b8d0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.15rem;
            word-wrap: break-word;
        }

        .subtitle {
            text-align: center;
            font-size: clamp(0.78rem, 3vw, 0.95rem);
            color: #8a9fc8;
            font-weight: 400;
            letter-spacing: 0.4px;
            margin-bottom: clamp(1rem, 4vw, 1.6rem);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0 0.5rem;
            flex-wrap: wrap;
        }

        .subtitle .dot {
            display: inline-block;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #4a7dff;
            animation: blink 1.6s infinite;
            flex-shrink: 0;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        /* ============================================================
           SOCIAL LINKS
           ============================================================ */
        .social-links {
            display: flex;
            gap: clamp(6px, 2vw, 12px);
            justify-content: center;
            margin-bottom: clamp(1rem, 4vw, 1.6rem);
            flex-wrap: wrap;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 60px;
            padding: clamp(0.5rem, 2vw, 0.65rem) clamp(0.8rem, 3vw, 1.2rem);
            font-size: clamp(0.75rem, 2.8vw, 0.85rem);
            font-weight: 500;
            color: #d0deff;
            text-decoration: none;
            transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            box-shadow: 0 4px 10px -8px rgba(0,0,0,0.6);
            flex: 1;
            min-width: 0;
            min-height: 44px;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        .social-link:hover {
            background: rgba(60, 120, 255, 0.2);
            border-color: rgba(80, 150, 255, 0.5);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -12px rgba(60, 130, 255, 0.6);
        }

        .social-link:active {
            transform: scale(0.97);
            background: rgba(60, 120, 255, 0.35);
        }

        .social-icon {
            font-size: clamp(0.9rem, 3vw, 1.1rem);
            line-height: 1;
            flex-shrink: 0;
        }

        .social-link.instagram:hover {
            background: linear-gradient(135deg, rgba(225, 48, 108, 0.25), rgba(255, 149, 0, 0.25));
            border-color: rgba(225, 48, 108, 0.5);
            box-shadow: 0 10px 20px -12px rgba(225, 48, 108, 0.5);
        }

        .social-link.facebook:hover {
            background: rgba(24, 119, 242, 0.25);
            border-color: rgba(24, 119, 242, 0.6);
            box-shadow: 0 10px 20px -12px rgba(24, 119, 242, 0.5);
        }

        /* ============================================================
           INFO LIST
           ============================================================ */
        .info-list {
            display: flex;
            flex-direction: column;
            gap: clamp(6px, 1.5vw, 8px);
            margin-bottom: clamp(1rem, 4vw, 1.6rem);
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: clamp(10px, 3vw, 14px);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: clamp(0.9rem, 3vw, 1.2rem);
            padding: clamp(0.6rem, 2.5vw, 0.8rem) clamp(0.9rem, 3vw, 1.2rem);
            transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            text-decoration: none;
            color: #e8eeff;
            min-height: 56px;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        .info-item:hover {
            background: rgba(60, 120, 255, 0.1);
            border-color: rgba(80, 150, 255, 0.35);
            transform: translateX(4px) scale(1.01);
            box-shadow: 0 6px 16px -8px rgba(60, 130, 255, 0.4);
        }

        .info-item:active {
            transform: scale(0.98);
            background: rgba(60, 120, 255, 0.18);
        }

        .info-icon {
            font-size: clamp(1.1rem, 4vw, 1.4rem);
            width: clamp(22px, 6vw, 28px);
            text-align: center;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
            transition: transform 0.2s;
            flex-shrink: 0;
        }

        .info-item:hover .info-icon {
            transform: scale(1.15);
        }

        .info-content {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
        }

        .info-label {
            font-size: clamp(0.6rem, 2.2vw, 0.7rem);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #6a80a8;
            font-weight: 500;
            margin-bottom: 1px;
        }

        .info-value {
            font-size: clamp(0.82rem, 3.2vw, 1rem);
            font-weight: 500;
            color: #eef4ff;
            letter-spacing: -0.01em;
            word-break: break-word;
            overflow-wrap: break-word;
            line-height: 1.3;
        }

        .info-value a {
            color: #b0ccff;
            text-decoration: none;
            transition: color 0.2s;
        }

        .info-value a:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        /* ============================================================
           ACTION BUTTONS
           ============================================================ */
        .actions {
            display: flex;
            gap: clamp(6px, 2vw, 10px);
            margin-top: clamp(1rem, 3vw, 1.4rem);
            margin-bottom: 0.6rem;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 120px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 60px;
            padding: clamp(0.6rem, 2.5vw, 0.8rem) clamp(0.5rem, 2vw, 0.6rem);
            font-size: clamp(0.75rem, 2.8vw, 0.85rem);
            font-weight: 500;
            color: #d0deff;
            cursor: none;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-family: inherit;
            letter-spacing: 0.2px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            text-decoration: none;
            box-shadow: 0 4px 10px -8px rgba(0,0,0,0.6);
            min-height: 44px;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-appearance: none;
            appearance: none;
        }

        .btn:hover {
            background: rgba(60, 120, 255, 0.2);
            border-color: rgba(80, 150, 255, 0.5);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -12px rgba(60, 130, 255, 0.6);
        }

        .btn:active {
            transform: scale(0.97);
            background: rgba(60, 120, 255, 0.35);
        }

        .btn-icon {
            font-size: clamp(0.85rem, 3vw, 1rem);
        }

        /* ============================================================
           FOOTER
           ============================================================ */
        .footer {
            text-align: center;
            font-size: clamp(0.6rem, 2.2vw, 0.7rem);
            color: #4d5e7a;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            margin-top: clamp(1rem, 3vw, 1.4rem);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            opacity: 0.7;
            flex-wrap: wrap;
            padding: 0 0.5rem;
        }

        .footer .pulse-dot {
            display: inline-block;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #4a7dff;
            animation: blink 1.8s infinite;
            flex-shrink: 0;
        }

        /* ============================================================
           TOAST
           ============================================================ */
        .toast {
            position: fixed;
            bottom: calc(20px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%) translateY(120px);
            background: #0e1625;
            color: #eef5ff;
            padding: 12px 24px;
            border-radius: 60px;
            font-size: clamp(0.78rem, 2.8vw, 0.9rem);
            font-weight: 500;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.9),
                        0 0 0 1px rgba(80, 150, 255, 0.3);
            border: 1px solid rgba(80, 150, 255, 0.2);
            transition: transform 0.45s cubic-bezier(0.2, 0.9, 0.4, 1);
            z-index: 999;
            pointer-events: none;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            white-space: nowrap;
            max-width: 90vw;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* ============================================================
           RESPONSIVE BREAKPOINTS
           ============================================================ */
        @media (max-width: 360px) {
            .card {
                border-radius: 1.5rem;
                padding: 1rem 0.85rem 0.9rem;
            }
            .social-links { flex-direction: column; }
            .actions { flex-direction: column; }
            .btn { min-width: unset; width: 100%; }
            .info-item {
                gap: 8px;
                padding: 0.55rem 0.75rem;
                min-height: 52px;
            }
        }

        @media (min-width: 361px) and (max-width: 420px) {
            .card { border-radius: 2rem; }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            body {
                align-items: flex-start;
                padding-top: 0.5rem;
                padding-bottom: 0.5rem;
            }
            .card {
                max-width: 90vw;
                padding: 0.9rem 1.2rem;
                border-radius: 1.5rem;
            }
            .avatar-wrapper { margin-bottom: 0.3rem; }
            .avatar { width: 60px; height: 60px; font-size: 1.8rem; }
            h1 { font-size: 1.2rem; }
            .subtitle { font-size: 0.75rem; margin-bottom: 0.7rem; }
            .social-links, .info-list { margin-bottom: 0.7rem; }
            .info-item { min-height: 44px; padding: 0.4rem 0.8rem; }
            .info-label { display: none; }
            .footer { margin-top: 0.7rem; }
        }

        @media (min-width: 600px) and (max-width: 1024px) {
            .card {
                max-width: 500px;
                padding: 2.5rem 2.2rem 2rem;
            }
            h1 { font-size: 2.1rem; }
            .avatar { width: 130px; height: 130px; font-size: 3.6rem; }
            .info-item { padding: 1rem 1.4rem; }
            .social-link { padding: 0.8rem 1.4rem; font-size: 0.95rem; }
            .btn { padding: 1rem 0.8rem; font-size: 0.95rem; }
        }

        @media (min-width: 1025px) and (max-width: 1440px) {
            .card { max-width: 460px; }
        }

        @media (min-width: 1441px) {
            .card {
                max-width: 500px;
                padding: 3rem 2.5rem 2.5rem;
                border-radius: 3rem;
            }
            h1 { font-size: 2.4rem; }
            .avatar { width: 140px; height: 140px; font-size: 4rem; }
            .subtitle { font-size: 1.1rem; }
            .info-value { font-size: 1.1rem; }
            .social-link { padding: 0.9rem 1.6rem; font-size: 1rem; }
            .btn { padding: 1rem 1rem; font-size: 1rem; }
        }

        @media (max-width: 280px) {
            .card { padding: 0.8rem 0.7rem; border-radius: 1.2rem; }
            .avatar { width: 60px; height: 60px; font-size: 1.8rem; }
            h1 { font-size: 1.1rem; }
            .subtitle { font-size: 0.7rem; }
            .info-icon { font-size: 1rem; width: 20px; }
            .info-value { font-size: 0.75rem; }
            .social-icon, .btn-icon { font-size: 0.8rem; }
            .social-link, .btn {
                font-size: 0.7rem;
                padding: 0.45rem 0.6rem;
                min-height: 38px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
            #particle-canvas { display: none; }
        }

        @media (prefers-contrast: more) {
            .card {
                background: rgba(0, 0, 0, 0.95);
                border: 2px solid rgba(255, 255, 255, 0.4);
            }
            .info-item { border: 1.5px solid rgba(255, 255, 255, 0.3); }
            .info-value { color: #ffffff; }
            .subtitle { color: #b8c8e8; }
        }

        @media print {
            body { background: #ffffff; color: #000000; cursor: auto; }
            #particle-canvas, .cursor-glow, .cursor-dot, .cursor-ring, .toast {
                display: none !important;
            }
            .card {
                background: #ffffff;
                color: #000000;
                box-shadow: none;
                border: 1px solid #cccccc;
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
                animation: none;
            }
            h1 {
                background: none;
                -webkit-text-fill-color: initial;
                color: #000000;
            }
            .info-value, .subtitle, .info-label { color: #333333; }
            .info-item, .social-link, .btn {
                background: #f5f5f5;
                border: 1px solid #cccccc;
                color: #000000;
            }
        }
    </style>
</head>
<body>
    <!-- Particle canvas -->
    <canvas id="particle-canvas"></canvas>

    <!-- Custom cursor (desktop only) -->
    <div class="cursor-glow" id="cursorGlow"></div>
    <div class="cursor-ring" id="cursorRing"></div>
    <div class="cursor-dot" id="cursorDot"></div>

    <!-- Main card -->
    <main class="card" role="main">
        <div class="avatar-wrapper">
            <div class="avatar" id="profileAvatar">
                <img src="profile.jpg"
                     alt="Klent Josh Vargas profile photo"
                     id="profileImage"
                     loading="eager"
                     decoding="async">
            </div>
        </div>

        <h1>Klent Josh Vargas</h1>
        <div class="subtitle">
            <span>Soon to be Software Developer</span>
        </div>

        <!-- Social links -->
        <nav class="social-links" aria-label="Social media links">
            <a href="https://www.instagram.com/1nonly.kosh/"
               target="_blank"
               rel="noopener noreferrer"
               class="social-link instagram"
               aria-label="Instagram profile">
                <span class="social-icon" aria-hidden="true">📷</span>
                <span>Instagram</span>
            </a>
            <a href="https://www.facebook.com/koshvjosh01"
               target="_blank"
               rel="noopener noreferrer"
               class="social-link facebook"
               aria-label="Facebook profile">

        <!-- Personal info -->
        <section class="info-list" aria-label="Personal information">
            <div class="info-item" role="group" aria-label="Email">
                <span class="info-icon" aria-hidden="true">📧</span>
                <div class="info-content">
                    <span class="info-label">email</span>
                    <span class="info-value">klentvargas7@gmail.com</span>
                </div>
            </div>

            <div class="info-item" role="group" aria-label="Phone number">
                <span class="info-icon" aria-hidden="true">📱</span>
                <div class="info-content">
                    <span class="info-label">phone</span>
                    <span class="info-value">+63 981 463 7926</span>
                </div>
            </div>

            <div class="info-item" role="group" aria-label="Location">
                <span class="info-icon" aria-hidden="true">📍</span>
                <div class="info-content">
                    <span class="info-label">location</span>
                    <span class="info-value">Olongapo City, Zambales</span>
                </div>
            </div>

            <div class="info-item" role="group" aria-label="Course">
                <span class="info-icon" aria-hidden="true">🎓</span>
                <div class="info-content">
                    <span class="info-label">course</span>
                    <span class="info-value">BS Computer Science</span>
                </div>
            </div>

            <div class="info-item" role="group" aria-label="Role">
                <span class="info-icon" aria-hidden="true">💼</span>
                <div class="info-content">
                    <span class="info-label">role</span>
                    <span class="info-value">Student</span>
                </div>
            </div>
        </section>

        <!-- Action buttons -->
        <div class="actions">
            <a href="#" class="btn" id="copyEmailBtn" role="button" aria-label="Copy email address">
                <span class="btn-icon" aria-hidden="true">📋</span> copy email
            </a>
            <a href="#" class="btn" id="shareBtn" role="button" aria-label="Share this card">
                <span class="btn-icon" aria-hidden="true">📤</span> share
            </a>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <span class="pulse-dot" aria-hidden="true"></span>
            <span>Student Athlete · Always Free</span>
            <span class="pulse-dot" aria-hidden="true"></span>
        </footer>
    </main>

    <!-- Toast notification -->
    <div class="toast" id="toastMessage" role="status" aria-live="polite">✨ action done</div>

<script>
    (function() {
        'use strict';

        // ============================================================
        // FORCE OVERRIDE reduced-motion (so particles always show)
        // ============================================================
        const override = document.createElement('style');
        override.textContent = `
            #particle-canvas {
                display: block !important;
                visibility: visible !important;
                opacity: 1 !important;
            }
            @media (prefers-reduced-motion: reduce) {
                #particle-canvas { display: block !important; }
                *, *::before, *::after {
                    animation-duration: initial !important;
                    animation-iteration-count: initial !important;
                    transition-duration: initial !important;
                }
            }
        `;
        document.head.appendChild(override);

        // ============================================================
        // DEVICE DETECTION
        // ============================================================
        const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

        // ============================================================
        // 1. PARTICLE BACKGROUND
        // ============================================================
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');

        let width = window.innerWidth;
        let height = window.innerHeight;
        const PARTICLE_COUNT = 120;
        let particles = [];
        let mouse = { x: null, y: null };
        let smoothMouse = { x: null, y: null };

        function initCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            createParticles();
        }

        function createParticles() {
            particles = [];
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 1.2,
                    vy: (Math.random() - 0.5) * 1.2,
                    radius: Math.random() * 2.5 + 1.5,
                    brightness: Math.random() * 0.5 + 0.5
                });
            }
        }

        function draw() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, width, height);

            if (mouse.x !== null) {
                if (smoothMouse.x === null) {
                    smoothMouse.x = mouse.x;
                    smoothMouse.y = mouse.y;
                }
                smoothMouse.x += (mouse.x - smoothMouse.x) * 0.15;
                smoothMouse.y += (mouse.y - smoothMouse.y) * 0.15;
            }

            // Ambient glow
            if (smoothMouse.x !== null) {
                const g = ctx.createRadialGradient(smoothMouse.x, smoothMouse.y, 0, smoothMouse.x, smoothMouse.y, 220);
                g.addColorStop(0, 'rgba(80, 160, 255, 0.12)');
                g.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = g;
                ctx.fillRect(0, 0, width, height);
            }

            // Particles
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < -10) p.x = width + 10;
                if (p.x > width + 10) p.x = -10;
                if (p.y < -10) p.y = height + 10;
                if (p.y > height + 10) p.y = -10;

                if (smoothMouse.x !== null) {
                    const dx = p.x - smoothMouse.x;
                    const dy = p.y - smoothMouse.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 180 && dist > 0.1) {
                        const f = (180 - dist) / 180;
                        p.vx += (dx / dist) * f * 0.06;
                        p.vy += (dy / dist) * f * 0.06;
                    }
                }

                const sp = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
                if (sp > 1.5) {
                    p.vx = (p.vx / sp) * 1.5;
                    p.vy = (p.vy / sp) * 1.5;
                }

                const hue = 210 + (p.x / width) * 30;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${hue}, 90%, 75%, ${p.brightness})`;
                ctx.shadowColor = `hsla(${hue}, 95%, 70%, 1)`;
                ctx.shadowBlur = 15;
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            // Lines between particles
            ctx.lineWidth = 0.8;
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const a = particles[i];
                    const b = particles[j];
                    const dx = a.x - b.x;
                    const dy = a.y - b.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 140) {
                        ctx.beginPath();
                        ctx.moveTo(a.x, a.y);
                        ctx.lineTo(b.x, b.y);
                        ctx.strokeStyle = `rgba(130, 190, 255, ${(1 - dist / 140) * 0.45})`;
                        ctx.stroke();
                    }
                }
            }

            // Cursor lines
            if (smoothMouse.x !== null) {
                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    const dx = p.x - smoothMouse.x;
                    const dy = p.y - smoothMouse.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 170) {
                        ctx.beginPath();
                        ctx.moveTo(smoothMouse.x, smoothMouse.y);
                        ctx.lineTo(p.x, p.y);
                        ctx.strokeStyle = `rgba(160, 210, 255, ${(1 - dist / 170) * 0.6})`;
                        ctx.lineWidth = 0.9;
                        ctx.stroke();
                    }
                }
                ctx.lineWidth = 0.8;
            }

            requestAnimationFrame(draw);
        }

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (e.touches[0]) {
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
            }
        }, { passive: true });

        window.addEventListener('mouseleave', () => {
            mouse.x = null;
            mouse.y = null;
        });

        window.addEventListener('resize', () => {
            initCanvas();
        });

        initCanvas();
        draw();

        // Remove the diagnostic panel if it's still in the DOM
        const oldDiag = document.querySelector('div[style*="z-index: 99999"]');
        if (oldDiag) oldDiag.remove();

        // ============================================================
        // 2. TOAST + HAPTIC + BUTTONS
        // ============================================================
        const toast = document.getElementById('toastMessage');
        let toastTimer = null;

        function showToast(message) {
            if (toastTimer) clearTimeout(toastTimer);
            toast.textContent = message;
            toast.classList.add('show');
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 2200);
        }

        function haptic(duration) {
            if ('vibrate' in navigator) {
                try { navigator.vibrate(duration); } catch(e) {}
            }
        }

        // ---- Copy Email Button ----
        const copyBtn = document.getElementById('copyEmailBtn');
        if (copyBtn) {
            copyBtn.addEventListener('click', (e) => {
                e.preventDefault();
                const email = 'klentvargas7@gmail.com';

                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(email).then(() => {
                        showToast('📧 email copied to clipboard');
                    }).catch(() => {
                        fallbackCopy(email);
                    });
                } else {
                    fallbackCopy(email);
                }
                haptic(10);
            });
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            textarea.style.left = '-9999px';
            textarea.setAttribute('readonly', '');
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('📧 email copied to clipboard');
            } catch(err) {
                showToast('📧 ' + text);
            }
            document.body.removeChild(textarea);
        }

        // ---- Share Button ----
        const shareBtn = document.getElementById('shareBtn');
        if (shareBtn) {
            shareBtn.addEventListener('click', (e) => {
                e.preventDefault();
                const shareData = {
                    title: 'Klent Josh Vargas · contact',
                    text: "Check out Klent Josh Vargas's digital card",
                    url: window.location.href,
                };

                if (navigator.share) {
                    navigator.share(shareData).catch(() => {});
                } else if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(window.location.href).then(() => {
                        showToast('🔗 link copied to clipboard');
                    }).catch(() => {
                        fallbackCopy(window.location.href);
                    });
                } else {
                    fallbackCopy(window.location.href);
                }
                haptic(10);
            });
        }

        // ---- Info-item tap feedback ----
        const infoItems = document.querySelectorAll('.info-item');
        infoItems.forEach((item) => {
            item.addEventListener('click', (e) => {
                const link = item.querySelector('a');
                if (link && e.target.closest('a')) return;
                const value = item.querySelector('.info-value')?.innerText || '';
                showToast(`📋 ${value}`);
                haptic(6);
            });
        });

        // ============================================================
        // 3. DESKTOP CURSOR + CARD TILT
        // ============================================================
        const cursorGlow = document.getElementById('cursorGlow');
        const cursorRing = document.getElementById('cursorRing');
        const cursorDot = document.getElementById('cursorDot');

        if (!isTouchDevice && cursorGlow && cursorRing && cursorDot) {
            window.addEventListener('mousemove', (e) => {
                cursorGlow.style.left = e.clientX + 'px';
                cursorGlow.style.top = e.clientY + 'px';
                cursorRing.style.left = e.clientX + 'px';
                cursorRing.style.top = e.clientY + 'px';
                cursorDot.style.left = e.clientX + 'px';
                cursorDot.style.top = e.clientY + 'px';
            }, { passive: true });

            window.addEventListener('mousedown', () => {
                cursorRing.style.width = '60px';
                cursorRing.style.height = '60px';
                cursorDot.style.width = '14px';
                cursorDot.style.height = '14px';
            });

            window.addEventListener('mouseup', () => {
                cursorRing.style.width = '40px';
                cursorRing.style.height = '40px';
                cursorDot.style.width = '8px';
                cursorDot.style.height = '8px';
            });

            document.querySelectorAll('a, button, .btn, .social-link, .info-item').forEach(el => {
                el.addEventListener('mouseenter', () => {
                    cursorRing.style.width = '60px';
                    cursorRing.style.height = '60px';
                    cursorRing.style.borderColor = 'rgba(150, 200, 255, 0.9)';
                    cursorDot.style.width = '12px';
                    cursorDot.style.height = '12px';
                });
                el.addEventListener('mouseleave', () => {
                    cursorRing.style.width = '40px';
                    cursorRing.style.height = '40px';
                    cursorRing.style.borderColor = 'rgba(120, 180, 255, 0.6)';
                    cursorDot.style.width = '8px';
                    cursorDot.style.height = '8px';
                });
            });

            // Card tilt (only on larger screens)
            const card = document.querySelector('.card');
            if (card && window.matchMedia('(min-width: 768px)').matches) {
                card.addEventListener('mousemove', (e) => {
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    const rotateX = (y - rect.height / 2) / 30;
                    const rotateY = (rect.width / 2 - x) / 30;
                    card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
                });
                card.addEventListener('mouseleave', () => {
                    card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg)';
                });
            }
        }

        // ============================================================
        // 4. iOS DOUBLE-TAP ZOOM PREVENTION
        // ============================================================
        let lastTouchEnd = 0;
        document.addEventListener('touchend', (e) => {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) e.preventDefault();
            lastTouchEnd = now;
        }, { passive: false });

        // ============================================================
        // 5. iOS 100vh FIX
        // ============================================================
        function setVH() {
            const vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', vh + 'px');
        }
        setVH();
        window.addEventListener('resize', setVH, { passive: true });
        window.addEventListener('orientationchange', () => setTimeout(setVH, 100));

        console.log('✅ Particles + buttons + toast all active.');
    })();
</script>
