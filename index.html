<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Klent Josh Vargas · personal card</title>
    <style>
        /* reset & base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        /* ---------- PARTICLE CANVAS (BLACK BACKGROUND) ---------- */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background: #000000;
        }

        /* ---------- MAIN CARD (FLOATING OVER PARTICLES) ---------- */
        .card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            background: rgba(10, 12, 18, 0.75);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.9), 
                        0 0 0 1px rgba(255, 255, 255, 0.02) inset,
                        0 0 50px rgba(60, 130, 255, 0.08);
            padding: 2.2rem 1.8rem 1.8rem 1.8rem;
            color: #f0f3fa;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: cardPulse 6s infinite alternate;
        }

        @keyframes cardPulse {
            0% { 
                box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.9), 
                            0 0 0 1px rgba(255, 255, 255, 0.02) inset,
                            0 0 40px rgba(60, 130, 255, 0.05);
            }
            100% { 
                box-shadow: 0 30px 70px -10px rgba(40, 100, 220, 0.25), 
                            0 0 0 1.5px rgba(100, 170, 255, 0.15) inset,
                            0 0 80px rgba(60, 130, 255, 0.15);
            }
        }

        /* subtle top accent line */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 10%;
            width: 80%;
            height: 1px;
            background: linear-gradient(90deg, transparent, #4a7dff, #80b0ff, #4a7dff, transparent);
            opacity: 0.6;
            border-radius: 100%;
        }

        /* ---------- PROFILE IMAGE ---------- */
        .avatar-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 0.8rem;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: linear-gradient(145deg, #1a2a4a, #0f1a2e);
            border: 3px solid rgba(100, 160, 255, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.2rem;
            font-weight: 500;
            color: #b0c8ff;
            box-shadow: 0 0 30px rgba(60, 120, 255, 0.25), 
                        0 8px 20px -6px rgba(0, 0, 0, 0.8);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }

        /* Profile image styling — if you add an image, it fills the circle */
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
        }

        .avatar:hover {
            transform: scale(1.03) rotate(-2deg);
            box-shadow: 0 0 50px rgba(80, 150, 255, 0.45), 
                        0 12px 24px -8px rgba(0, 0, 0, 0.9);
        }

        /* fallback initial (shown when no image) */
        .avatar .initial {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            text-align: center;
            letter-spacing: -0.02em;
            background: linear-gradient(to right, #ffffff, #b8d0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.15rem;
        }

        .subtitle {
            text-align: center;
            font-size: 0.95rem;
            color: #8a9fc8;
            font-weight: 400;
            letter-spacing: 0.4px;
            margin-bottom: 1.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .subtitle .dot {
            display: inline-block;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #4a7dff;
            animation: blink 1.6s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        /* ---------- SOCIAL LINKS (Instagram & Facebook) ---------- */
        .social-links {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 1.6rem;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 60px;
            padding: 0.65rem 1.2rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: #d0deff;
            text-decoration: none;
            transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1);
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 10px -8px rgba(0,0,0,0.6);
            flex: 1;
            min-width: 0;
        }

        .social-link:hover {
            background: rgba(60, 120, 255, 0.2);
            border-color: rgba(80, 150, 255, 0.5);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -12px rgba(60, 130, 255, 0.6);
        }

        .social-link:active {
            transform: scale(0.97);
            background: rgba(60, 120, 255, 0.35);
        }

        .social-icon {
            font-size: 1.1rem;
            line-height: 1;
        }

        /* Instagram specific hover accent */
        .social-link.instagram:hover {
            background: linear-gradient(135deg, rgba(225, 48, 108, 0.25), rgba(255, 149, 0, 0.25));
            border-color: rgba(225, 48, 108, 0.5);
            box-shadow: 0 10px 20px -12px rgba(225, 48, 108, 0.5);
        }

        /* Facebook specific hover accent */
        .social-link.facebook:hover {
            background: rgba(24, 119, 242, 0.25);
            border-color: rgba(24, 119, 242, 0.6);
            box-shadow: 0 10px 20px -12px rgba(24, 119, 242, 0.5);
        }

        /* ---------- INFO LIST (personal details) ---------- */
        .info-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 1.6rem;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 1.2rem;
            padding: 0.8rem 1.2rem;
            transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1);
            backdrop-filter: blur(5px);
            text-decoration: none;
            color: #e8eeff;
        }

        .info-item:hover {
            background: rgba(60, 120, 255, 0.1);
            border-color: rgba(80, 150, 255, 0.35);
            transform: translateX(4px) scale(1.01);
            box-shadow: 0 6px 16px -8px rgba(60, 130, 255, 0.4);
        }

        .info-item:active {
            transform: scale(0.99);
        }

        .info-icon {
            font-size: 1.4rem;
            width: 28px;
            text-align: center;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
            transition: transform 0.2s;
        }

        .info-item:hover .info-icon {
            transform: scale(1.15);
        }

        .info-content {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .info-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #6a80a8;
            font-weight: 500;
            margin-bottom: 1px;
        }

        .info-value {
            font-size: 1rem;
            font-weight: 500;
            color: #eef4ff;
            letter-spacing: -0.01em;
            word-break: break-word;
        }

        .info-value a {
            color: #b0ccff;
            text-decoration: none;
            transition: color 0.2s;
        }

        .info-value a:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        /* ---------- ACTION BUTTONS (interactive) ---------- */
        .actions {
            display: flex;
            gap: 10px;
            margin-top: 1.4rem;
            margin-bottom: 0.6rem;
        }

        .btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 60px;
            padding: 0.8rem 0.6rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: #d0deff;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-family: inherit;
            letter-spacing: 0.2px;
            backdrop-filter: blur(5px);
            text-decoration: none;
            box-shadow: 0 4px 10px -8px rgba(0,0,0,0.6);
        }

        .btn:hover {
            background: rgba(60, 120, 255, 0.2);
            border-color: rgba(80, 150, 255, 0.5);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -12px rgba(60, 130, 255, 0.6);
        }

        .btn:active {
            transform: scale(0.97);
            background: rgba(60, 120, 255, 0.35);
        }

        .btn-icon {
            font-size: 1rem;
        }

        /* ---------- FOOTER ---------- */
        .footer {
            text-align: center;
            font-size: 0.7rem;
            color: #4d5e7a;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            margin-top: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            opacity: 0.7;
        }

        .footer .pulse-dot {
            display: inline-block;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #4a7dff;
            animation: blink 1.8s infinite;
        }

        /* ---------- TOAST ---------- */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(120px);
            background: #0e1625;
            color: #eef5ff;
            padding: 12px 28px;
            border-radius: 60px;
            font-size: 0.9rem;
            font-weight: 500;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.9), 
                        0 0 0 1px rgba(80, 150, 255, 0.3);
            border: 1px solid rgba(80, 150, 255, 0.2);
            transition: transform 0.45s cubic-bezier(0.2, 0.9, 0.4, 1);
            z-index: 999;
            pointer-events: none;
            backdrop-filter: blur(16px);
            white-space: nowrap;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 420px) {
            .card {
                padding: 1.6rem 1.2rem 1.4rem 1.2rem;
                border-radius: 2rem;
            }
            h1 {
                font-size: 1.7rem;
            }
            .avatar {
                width: 90px;
                height: 90px;
                font-size: 2.6rem;
            }
            .info-item {
                padding: 0.7rem 1rem;
            }
            .info-value {
                font-size: 0.9rem;
            }
            .btn {
                font-size: 0.78rem;
                padding: 0.7rem 0.4rem;
            }
            .social-link {
                font-size: 0.78rem;
                padding: 0.55rem 0.9rem;
            }
        }

        @media (max-width: 340px) {
            .actions {
                flex-direction: column;
                gap: 8px;
            }
            .social-links {
                flex-direction: column;
                gap: 8px;
            }
            .info-item {
                gap: 10px;
                padding: 0.6rem 0.9rem;
            }
        }
    </style>
</head>
<body>

    <!-- toast message -->
    <div class="toast" id="toastMessage">✨ action done</div>

    <script>
        (function() {
            // ============================================================
            // 1. PARTICLE BACKGROUND (black background with moving dots)
            // ============================================================
            const canvas = document.getElementById('particle-canvas');
            const ctx = canvas.getContext('2d');

            let width, height;
            let particles = [];
            const PARTICLE_COUNT = 120;
            const MAX_SPEED = 0.6;
            const CONNECT_DISTANCE = 130;
            const MOUSE_RADIUS = 160;

            let mouse = { x: null, y: null };

            function initCanvas() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
                createParticles();
            }

            function createParticles() {
                particles = [];
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    particles.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        vx: (Math.random() - 0.5) * MAX_SPEED * 2,
                        vy: (Math.random() - 0.5) * MAX_SPEED * 2,
                        radius: Math.random() * 2 + 1.2,
                        brightness: Math.random() * 0.5 + 0.4
                    });
                }
            }

            function draw() {
                ctx.clearRect(0, 0, width, height);
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, width, height);

                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;

                    if (p.x < -10) p.x = width + 10;
                    if (p.x > width + 10) p.x = -10;
                    if (p.y < -10) p.y = height + 10;
                    if (p.y > height + 10) p.y = -10;

                    if (mouse.x !== null && mouse.y !== null) {
                        const dx = p.x - mouse.x;
                        const dy = p.y - mouse.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < MOUSE_RADIUS && dist > 0.1) {
                            const force = (MOUSE_RADIUS - dist) / MOUSE_RADIUS;
                            p.vx += (dx / dist) * force * 0.03;
                            p.vy += (dy / dist) * force * 0.03;
                        }
                    }

                    const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
                    if (speed > MAX_SPEED * 1.4) {
                        p.vx = (p.vx / speed) * MAX_SPEED * 1.4;
                        p.vy = (p.vy / speed) * MAX_SPEED * 1.4;
                    }

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    const hue = 210 + (p.x / width) * 30;
                    ctx.fillStyle = `hsla(${hue}, 80%, 70%, ${p.brightness})`;
                    ctx.shadowColor = `hsla(${hue}, 90%, 65%, 0.5)`;
                    ctx.shadowBlur = 10;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }

                ctx.lineWidth = 0.7;
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const a = particles[i];
                        const b = particles[j];
                        const dx = a.x - b.x;
                        const dy = a.y - b.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < CONNECT_DISTANCE) {
                            const opacity = (1 - dist / CONNECT_DISTANCE) * 0.35;
                            ctx.beginPath();
                            ctx.moveTo(a.x, a.y);
                            ctx.lineTo(b.x, b.y);
                            ctx.strokeStyle = `rgba(120, 170, 255, ${opacity})`;
                            ctx.stroke();
                        }
                    }
                }

                if (mouse.x !== null && mouse.y !== null) {
                    ctx.beginPath();
                    ctx.arc(mouse.x, mouse.y, MOUSE_RADIUS * 0.8, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(60, 130, 255, 0.015)';
                    ctx.fill();
                }

                requestAnimationFrame(draw);
            }

            function onMouseMove(e) {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
            }

            function onMouseLeave() {
                mouse.x = null;
                mouse.y = null;
            }

            function onTouchMove(e) {
                if (e.touches.length > 0) {
                    mouse.x = e.touches[0].clientX;
                    mouse.y = e.touches[0].clientY;
                }
            }

            function onTouchEnd() {
                mouse.x = null;
                mouse.y = null;
            }

            let resizeTimeout;
            function onResize() {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(() => {
                    initCanvas();
                }, 120);
            }

            window.addEventListener('resize', onResize);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseleave', onMouseLeave);
            window.addEventListener('touchmove', onTouchMove, { passive: true });
            window.addEventListener('touchend', onTouchEnd);
            window.addEventListener('touchcancel', onTouchEnd);

            initCanvas();
            draw();

            // ============================================================
            // 2. INTERACTIVE BUTTONS & TOAST
            // ============================================================
            const toast = document.getElementById('toastMessage');
            let toastTimer = null;

            function showToast(message) {
                if (toastTimer) clearTimeout(toastTimer);
                toast.textContent = message;
                toast.classList.add('show');
                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                }, 2200);
            }

            // copy email button
            const copyBtn = document.getElementById('copyEmailBtn');
            copyBtn.addEventListener('click', (e) => {
                e.preventDefault();
                const email = 'klentvargas7@gmail.com';
                navigator.clipboard.writeText(email).then(() => {
                    showToast('📧 email copied to clipboard');
                }).catch(() => {
                    showToast('📧 klentvargas7@gmail.com');
                });
                if (navigator.vibrate) navigator.vibrate(10);
            });

            // share button
            const shareBtn = document.getElementById('shareBtn');
            shareBtn.addEventListener('click', (e) => {
                e.preventDefault();
                if (navigator.share) {
                    navigator.share({
                        title: 'Klent Josh Vargas · contact',
                        text: 'Check out Klent Josh Vargas\'s digital card',
                        url: window.location.href,
                    }).catch(() => {});
                } else {
                    navigator.clipboard.writeText(window.location.href).then(() => {
                        showToast('🔗 link copied to clipboard');
                    }).catch(() => {
                        showToast('📋 share this page with anyone');
                    });
                }
                if (navigator.vibrate) navigator.vibrate(10);
            });

            // subtle toast on info-item click
            const infoItems = document.querySelectorAll('.info-item');
            infoItems.forEach((item) => {
                item.addEventListener('click', (e) => {
                    const link = item.querySelector('a');
                    if (link && e.target.closest('a')) return;
                    
                    const value = item.querySelector('.info-value')?.innerText || '';
                    showToast(`📋 ${value}`);
                    if (navigator.vibrate) navigator.vibrate(6);
                });
            });

            // ============================================================
            // 3. EXTRA: card hover tilt (desktop)
            // ============================================================
            const card = document.querySelector('.card');
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const rotateX = (y - centerY) / 30;
                const rotateY = (centerX - x) / 30;
                card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            });

            card.addEventListener('mouseleave', () => {
                card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg)';
            });
